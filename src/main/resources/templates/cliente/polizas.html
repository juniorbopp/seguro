
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis pólizas | Sistema de Seguros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow p-4">
        <h1 class="mb-4">Mis pólizas</h1>

        <div th:if="${#lists.isEmpty(polizas)}" class="alert alert-info">
            No tenés pólizas registradas.
        </div>

        <div class="table-responsive"
             th:unless="${#lists.isEmpty(polizas)}">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Número</th>
                        <th>Tipo de cobertura</th>
                        <th>Fecha de inicio</th>
                        <th>Fecha de fin</th>
                        <th>Monto asegurado</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="poliza : ${polizas}">
                        <td th:text="${poliza.numeroPoliza}"></td>
                        <td th:text="${poliza.tipoCobertura}"></td>
                        <td th:text="${poliza.fechaInicio}"></td>
                        <td th:text="${poliza.fechaFin}"></td>
                        <td th:text="${poliza.montoAsegurado}"></td>
                        <td th:text="${poliza.estado}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a th:href="@{/inicio}" class="btn btn-secondary mt-3">
            Volver al inicio
        </a>
    </div>
</div>

</body>
</html>
