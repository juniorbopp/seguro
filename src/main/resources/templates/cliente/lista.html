<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1>Clientes</h1>

            <a href="#" class="btn btn-primary">
                + Nuevo cliente
            </a>

        </div>

        <div class="card shadow">

            <div class="card-body">

                <table class="table table-hover">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Documento</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Fecha de nacimiento</th>
                            <th>Estado civil</th>
                            <th>Dirección</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>

                    <tbody>

                        <tr th:each="cliente : ${clientes}">

                            <td th:text="${cliente.idCliente}"></td>

                            <td th:text="${cliente.nombre}"></td>

                            <td th:text="${cliente.apellido}"></td>

                            <td th:text="${cliente.documento}"></td>

                            <td th:text="${cliente.telefono}"></td>

                            <td th:text="${cliente.correo}"></td>

                            <td th:text="${cliente.fechaNacimiento}"></td>

                            <td th:text="${cliente.estadoCivil}"></td>

                            <td th:text="${cliente.direccion}"></td>

                            <td>
                                <a th:href="@{/admin/clientes/ver/{id}(id=${cliente.idCliente})}"
                                    class="btn btn-sm btn-primary">
                                    Ver
                                </a>

                                <a th:href="@{/admin/clientes/editar/{id}(id=${cliente.idCliente})}"
                                    class="btn btn-sm btn-warning">
                                    Editar
                                </a>

                                <a th:href="@{/admin/clientes/eliminar/{id}(id=${cliente.idCliente})}"
                                    class="btn btn-sm btn-danger">
                                    Eliminar
                                </a>

                            </td>

                        </tr>

                    </tbody>

                    </tbody>

                </table>

            </div>

        </div>

        <div class="mt-3">

            <a href="/admin" class="btn btn-secondary">
                ← Volver al inicio
            </a>

        </div>

    </div>

</body>

</html>
