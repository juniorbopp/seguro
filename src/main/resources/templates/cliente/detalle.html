<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalle del Cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

    <div class="container mt-5">

        <h2>Detalle del Cliente</h2>

        <div class="card mt-4">
            <div class="card-body">

                <p><strong>ID:</strong>
                    <span th:text="${cliente.idCliente}"></span>
                </p>

                <p><strong>Nombre:</strong>
                    <span th:text="${cliente.nombre}"></span>
                </p>

                <p><strong>Apellido:</strong>
                    <span th:text="${cliente.apellido}"></span>
                </p>

                <p><strong>Documento:</strong>
                    <span th:text="${cliente.documento}"></span>
                </p>

                <p><strong>Teléfono:</strong>
                    <span th:text="${cliente.telefono}"></span>
                </p>

                <p><strong>Correo:</strong>
                    <span th:text="${cliente.correo}"></span>
                </p>

                <p><strong>Fecha de nacimiento:</strong>
                    <span th:text="${cliente.fechaNacimiento}"></span>
                </p>

                <p><strong>Estado civil:</strong>
                    <span th:text="${cliente.estadoCivil}"></span>
                </p>

                <p><strong>Dirección:</strong>
                    <span th:text="${cliente.direccion}"></span>
                </p>

                <a href="/admin/clientes" class="btn btn-secondary">
                    ← Volver
                </a>

            </div>
        </div>

    </div>

</body>

</html>
