
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuenta no vinculada | Sistema de Seguros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="container mt-5">
    <div class="alert alert-warning shadow p-4">
        <h2>Cuenta no vinculada</h2>

        <p th:text="${error}">
            Esta cuenta todavía no está vinculada a un cliente.
        </p>

        <p>Contactá al administrador para completar la vinculación.</p>

        <a th:href="@{/inicio}" class="btn btn-primary">
            Volver al inicio
        </a>
    </div>
</div>

</body>
</html>
