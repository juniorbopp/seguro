
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis siniestros | Sistema de Seguros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow p-4">
        <h1 class="mb-4">Mis siniestros</h1>

        <div th:if="${#lists.isEmpty(siniestros)}" class="alert alert-info">
            No tenés siniestros registrados.
        </div>

        <div class="table-responsive"
             th:unless="${#lists.isEmpty(siniestros)}">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>N.º</th>
                        <th>Descripción</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Observaciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="siniestro : ${siniestros}">
                        <td th:text="${siniestro.idSiniestro}"></td>
                        <td th:text="${siniestro.descripcionSiniestro}"></td>
                        <td th:text="${siniestro.fechaSiniestro}"></td>
                        <td th:text="${siniestro.estadoSiniestro}"></td>
                        <td th:text="${siniestro.observacionesSiniestro}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a th:href="@{/inicio}" class="btn btn-secondary mt-3">
            Volver al inicio
        </a>
    </div>
</div>

</body>
</html>
