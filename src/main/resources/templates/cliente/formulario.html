<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuevo Cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header">
                <h2>Registrar Cliente</h2>
            </div>

            <div class="card-body">

                <form th:action="@{/admin/clientes/guardar}" th:object="${cliente}" method="post">
                    <input type="hidden" th:field="*{idCliente}">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Nombre
                            </label>

                            <input type="text" class="form-control" th:field="*{nombre}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Apellido
                            </label>

                            <input type="text" class="form-control" th:field="*{apellido}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Documento
                            </label>

                            <input type="text" class="form-control" th:field="*{documento}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Teléfono
                            </label>

                            <input type="text" class="form-control" th:field="*{telefono}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Correo
                            </label>

                            <input type="email" class="form-control" th:field="*{correo}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Fecha de nacimiento
                            </label>

                            <input type="date" class="form-control" th:field="*{fechaNacimiento}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Estado civil
                            </label>

                            <input type="text" class="form-control" th:field="*{estadoCivil}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Dirección
                            </label>

                            <input type="text" class="form-control" th:field="*{direccion}">
                        </div>

                    </div>

                    <div class="mt-3">

                        <button type="submit" class="btn btn-primary">
                            Guardar cliente
                        </button>

                        <a href="/admin/clientes" class="btn btn-secondary">
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
