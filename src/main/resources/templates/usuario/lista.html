
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Usuarios</h2>
        <a href="/admin/usuarios/nuevo" class="btn btn-primary">
            + Nuevo usuario
        </a>
    </div>

    <div class="card">
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Teléfono</th>
                        <th>Estado</th>
                        <th>Fecha de ingreso</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.idUsuario}"></td>
                        <td th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.apellido}"></td>
                        <td th:text="${usuario.correo}"></td>
                        <td th:text="${usuario.rol}"></td>
                        <td th:text="${usuario.telefono}"></td>
                        <td>
                            <span th:if="${usuario.estado}" class="badge bg-success">
                                Activo
                            </span>
                            <span th:unless="${usuario.estado}" class="badge bg-secondary">
                                Inactivo
                            </span>
                        </td>
                        <td th:text="${usuario.fechaIngreso}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a href="/admin" class="btn btn-secondary mt-3">
        ← Volver al inicio
    </a>

</div>
</body>
</html>
