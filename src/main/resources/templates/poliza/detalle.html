```html
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalle de Póliza</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

    <div class="container mt-5">

        <h2>Detalle de la Póliza</h2>

        <div class="card mt-4">
            <div class="card-body">

                <p><strong>ID:</strong>
                    <span th:text="${poliza.idPoliza}"></span>
                </p>

                <p><strong>Número de póliza:</strong>
                    <span th:text="${poliza.numeroPoliza}"></span>
                </p>

                <p><strong>Tipo de cobertura:</strong>
                    <span th:text="${poliza.tipoCobertura}"></span>
                </p>

                <p><strong>Fecha de inicio:</strong>
                    <span th:text="${poliza.fechaInicio}"></span>
                </p>

                <p><strong>Fecha de fin:</strong>
                    <span th:text="${poliza.fechaFin}"></span>
                </p>

                <p><strong>Monto asegurado:</strong>
                    <span th:text="${poliza.montoAsegurado}"></span>
                </p>

                <p><strong>Prima:</strong>
                    <span th:text="${poliza.prima}"></span>
                </p>

                <p><strong>Estado:</strong>
                    <span th:text="${poliza.estado}"></span>
                </p>

                <p><strong>Cliente:</strong>
                    <span
                        th:text="${poliza.cliente != null ? poliza.cliente.nombre + ' ' + poliza.cliente.apellido : 'Sin cliente'}"></span>
                </p>

                <p><strong>Condiciones generales:</strong>
                    <span th:text="${poliza.condicioneGenerales}"></span>
                </p>

                <a href="/admin/polizas" class="btn btn-secondary">
                    ← Volver
                </a>

            </div>
        </div>

    </div>

</body>

</html>
```
