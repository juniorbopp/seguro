<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nueva Póliza</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

<div class="container mt-5">

    <h2>Nueva Póliza</h2>

    <div class="card mt-4">
        <div class="card-body">

            <form th:action="@{/admin/polizas/guardar}"
                  th:object="${poliza}"
                  method="post">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Número de póliza</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{numeroPoliza}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tipo de cobertura</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{tipoCobertura}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de inicio</label>
                        <input type="date"
                               class="form-control"
                               th:field="*{fechaInicio}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de fin</label>
                        <input type="date"
                               class="form-control"
                               th:field="*{fechaFin}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Monto asegurado</label>
                        <input type="number"
                               step="0.01"
                               class="form-control"
                               th:field="*{montoAsegurado}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Prima</label>
                        <input type="number"
                               step="0.01"
                               class="form-control"
                               th:field="*{prima}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Estado</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{estado}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cliente</label>

                        <select class="form-select"
                                th:field="*{cliente}">

                            <option value="">Seleccione un cliente</option>

                            <option th:each="cliente : ${clientes}"
                                    th:value="${cliente.idCliente}"
                                    th:text="${cliente.nombre + ' ' + cliente.apellido}">
                            </option>

                        </select>
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label">Condiciones generales</label>

                        <textarea class="form-control"
                                  rows="4"
                                  th:field="*{condicioneGenerales}">
                        </textarea>
                    </div>

                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar
                </button>

                <a href="/admin/polizas"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
