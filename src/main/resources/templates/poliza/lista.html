<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Pólizas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Pólizas</h2>

        <a href="/admin/polizas/nuevo" class="btn btn-primary">
            + Nueva póliza
        </a>
    </div>

    <div class="card">
        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Número</th>
                            <th>Tipo de cobertura</th>
                            <th>Fecha inicio</th>
                            <th>Fecha fin</th>
                            <th>Monto asegurado</th>
                            <th>Prima</th>
                            <th>Estado</th>
                            <th>Cliente</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="poliza : ${polizas}">

                            <td th:text="${poliza.idPoliza}"></td>

                            <td th:text="${poliza.numeroPoliza}"></td>

                            <td th:text="${poliza.tipoCobertura}"></td>

                            <td th:text="${poliza.fechaInicio}"></td>

                            <td th:text="${poliza.fechaFin}"></td>

                            <td th:text="${poliza.montoAsegurado}"></td>

                            <td th:text="${poliza.prima}"></td>

                            <td th:text="${poliza.estado}"></td>

                            <td th:text="${poliza.cliente.nombre + ' ' + poliza.cliente.apellido}"></td>

                            <td>
                                <a href="#" class="btn btn-sm btn-primary">
                                    Ver
                                </a>

                                <a href="#" class="btn btn-sm btn-warning">
                                    Editar
                                </a>

                                <a href="#" class="btn btn-sm btn-danger">
                                    Eliminar
                                </a>
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

    <a href="/admin" class="btn btn-secondary mt-3">
        ← Volver al inicio
    </a>

</div>

</body>
</html>
