
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Siniestro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Detalle del Siniestro</h2>

    <div class="card">
        <div class="card-body">
            <p>
                <strong>ID:</strong>
                <span th:text="${siniestro.idSiniestro}"></span>
            </p>

            <p>
                <strong>Descripción:</strong>
                <span th:text="${siniestro.descripcionSiniestro}"></span>
            </p>

            <p>
                <strong>Fecha:</strong>
                <span th:text="${siniestro.fechaSiniestro}"></span>
            </p>

            <p>
                <strong>Póliza:</strong>
                <span th:text="${siniestro.poliza != null ? siniestro.poliza.numeroPoliza : 'Sin póliza'}"></span>
            </p>

            <p>
                <strong>Estado:</strong>
                <span th:text="${siniestro.estadoSiniestroEntidad != null ? siniestro.estadoSiniestroEntidad.descripcion : 'Sin estado'}"></span>
            </p>

            <p>
                <strong>Observaciones:</strong>
                <span th:text="${siniestro.observacionesSiniestro}"></span>
            </p>

            <a href="/admin/siniestros" class="btn btn-secondary">
                ← Volver a la lista
            </a>
        </div>
    </div>
</div>
</body>
</html>
