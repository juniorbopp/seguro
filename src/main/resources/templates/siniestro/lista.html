<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Siniestros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Siniestros</h2>
        </div>

        <a th:href="@{/admin/siniestros/nuevo}" class="btn btn-primary mb-3">
            Nuevo siniestro
        </a>
        <div class="card">
            <div class="card-body table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Descripción</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Póliza</th>
                            <th>Observaciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="siniestro : ${siniestros}">
                            <td>
                            <td>
                                <a th:href="@{/admin/siniestros/ver/{id}(id=${siniestro.idSiniestro})}"
                                    class="btn btn-sm btn-primary">
                                    Ver
                                </a>
                                <a th:href="@{/admin/siniestros/archivar/{id}(id=${siniestro.idSiniestro})}"
                                    class="btn btn-sm btn-danger"
                                    onclick="return confirm('¿Querés archivar este siniestro? Podrás reanudarlo después.');">
                                    Archivar
                                </a>
                                <a th:href="@{/admin/siniestros/editar/{id}(id=${siniestro.idSiniestro})}"
                                    class="btn btn-sm btn-warning">
                                    Editar
                                </a>
                            </td>

                            </a>
                            </td>
                            <td th:text="${siniestro.idSiniestro}"></td>
                            <td th:text="${siniestro.descripcionSiniestro}"></td>
                            <td th:text="${siniestro.fechaSiniestro}"></td>
                            <td th:text="${siniestro.estadoSiniestro}"></td>
                            <td th:text="${siniestro.poliza != null ? siniestro.poliza.numeroPoliza : 'Sin póliza'}">
                            </td>
                            <td th:text="${siniestro.observacionesSiniestro}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <a href="/admin" class="btn btn-secondary mt-3">← Volver al inicio</a>

    </div>
</body>

</html>
