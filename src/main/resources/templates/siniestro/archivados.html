
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Siniestros Archivados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Siniestros Archivados</h2>
        <a href="/admin/siniestros" class="btn btn-secondary">
            Volver a siniestros
        </a>
    </div>

    <div class="card">
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Descripción</th>
                        <th>Fecha</th>
                        <th>Póliza</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="siniestro : ${siniestros}">
                        <td th:text="${siniestro.idSiniestro}"></td>
                        <td th:text="${siniestro.descripcionSiniestro}"></td>
                        <td th:text="${siniestro.fechaSiniestro}"></td>
                        <td th:text="${siniestro.poliza != null ? siniestro.poliza.numeroPoliza : 'Sin póliza'}"></td>
                        <td th:text="${siniestro.estadoSiniestroEntidad != null ? siniestro.estadoSiniestroEntidad.descripcion : 'Sin estado'}"></td>
                        <td>
                            <a th:href="@{/admin/siniestros/reanudar/{id}(id=${siniestro.idSiniestro})}"
                               class="btn btn-sm btn-success">
                                Reanudar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
