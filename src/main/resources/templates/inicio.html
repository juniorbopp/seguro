
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio | Sistema de Seguros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow p-4">
        <h1 class="mb-3">Sistema de Seguros</h1>

        <p>
            Bienvenido,
            <strong th:text="${correo}">usuario@seguro.com</strong>
        </p>

        <!-- Opciones exclusivas del administrador -->
        <div th:if="${esAdmin}" class="d-flex gap-2 flex-wrap">
            <a th:href="@{/admin/clientes}" class="btn btn-primary">
                Gestionar clientes
            </a>

            <a th:href="@{/admin/polizas}" class="btn btn-primary">
                Gestionar pólizas
            </a>

            <a th:href="@{/admin/siniestros}" class="btn btn-primary">
                Gestionar siniestros
            </a>

            <a th:href="@{/admin/usuarios}" class="btn btn-primary">
                Gestionar usuarios
            </a>
        </div>

        <!-- Opciones exclusivas del cliente -->
        <div th:unless="${esAdmin}" class="d-flex gap-2 flex-wrap">
            <a th:href="@{/cliente/polizas}" class="btn btn-success">
                Mis pólizas
            </a>

            <a th:href="@{/cliente/siniestros}" class="btn btn-success">
                Mis siniestros
            </a>
        </div>

        <form th:action="@{/logout}" method="post" class="mt-4">
            <button type="submit" class="btn btn-outline-danger">
                Cerrar sesión
            </button>
        </form>
    </div>
</div>

</body>
</html>
